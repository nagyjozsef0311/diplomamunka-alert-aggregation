# ELŐZETES RÖGZÍTÉS, 2. VÁLTOZAT – a gépek fontossági fokozata, AIT-ADS russellmitchell
#
# Ez váltja fel az 1. változatot (ait_russellmitchell_gepfontossag.yaml, 2026-11-18, commit 5c63392),
# amelyet nem írtunk felül. A javítás oka (D25): az AIT-LDSv2 közzétett leírása (Landauer és mtsai.
# 2023; 3.2.1 pont, 3. ábra, 6. táblázat) szerint a hálózat három zónából áll – intranet, DMZ,
# internet –, és az internetes zónában vannak a külső levelezőkiszolgálók és a globális DNS. Az 1.
# változat a gépneveket ennek ismerete nélkül értelmezte. A javítás a dokumentáción és a forgalom
# szerkezetén alapul; a TÁMADÁSI CÍMKÉKET EHHEZ SEM NÉZTÜK (6.3). A szerző 2026-11-18-án hagyta jóvá.
#
# Fokozatok (4.2. táblázat, kiegészítve):
#   5 – internet felől elérhető kiszolgáló, amely üzleti adatot tárol vagy felhasználókat azonosít
#   4 – belső kiszolgáló, amelytől sok más gép vagy felhasználó működése függ
#   3 – belső kiszolgáló korlátozott felhasználói körrel
#   2 – felhasználói munkaállomás
#   1 – teszt- vagy ideiglenes gép, illetve A SZERVEZETEN KÍVÜLI GÉP (új, D25)
# A nyilvántartásban nem szereplő gép a semleges 0,5 értéket kapja (4.2.2).

